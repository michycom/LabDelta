[package]
name = "labdelta"
version = "0.1.0"
description = "LabDelta static Stage 1 desktop shell"
authors = ["LabDelta contributors"]
edition = "2021"

[lib]
name = "labdelta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

